<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青青草原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none;
    background: url('assets/bg.webp') center center / cover no-repeat #6aa84f;
  }

  /* ===== 场景：横屏大图铺满全屏，比例锁定，不缩放不平移 ===== */
  #stage { position: fixed; inset: 0; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .cloud {
    position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
    pointer-events: none; animation: drift linear infinite;
  }
  @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }

  .char { position: absolute; bottom: 2.5%; transform: translateX(-50%); }
  .char canvas, .char img.anim, .char video.plain { display: block; width: 100%; height: 100%; pointer-events: none; }
  .char video.src {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; pointer-events: none;
  }
  .char .shadow {
    position: absolute; left: 50%; bottom: -2%; width: 78%; height: 5%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(30,60,20,.35), rgba(30,60,20,0) 70%);
    border-radius: 50%;
  }
  .char .halo {
    position: absolute; inset: -4% -7%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,240,170,.38), rgba(255,240,170,0) 65%);
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  .char.active .halo { opacity: 1; }
  #cow  { left: 36%; height: 74%; aspect-ratio: 1078 / 1282; z-index: 3; }
  #frog { left: 67%; height: 64%; aspect-ratio: 656 / 854;  z-index: 3; }
  @media (max-aspect-ratio: 1/1) {
    #cow  { left: 28%; width: 47%; height: auto; }
    #frog { left: 73%; width: 41%; height: auto; }
  }

  /* ===== 前景小草：按屏幕宽度比例（vw），切模式大小不变；宽屏封顶 ===== */
  #grass { position: fixed; left: 0; right: 0; bottom: 0; height: 7.7vw; z-index: 5; pointer-events: none; }
  #grass svg { position: absolute; bottom: -4px; height: 7.7vw; overflow: visible; }
  @media (min-width: 700px) {
    #grass { height: 34px; }
    #grass svg { height: 34px; }
  }
  .tuft { transform-origin: bottom center; animation: sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }

  /* ===== 飘叶：CSS 动画，大小同样按 vw ===== */
  #leaves { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  .leaf { position: absolute; top: 0; width: 2.8vw; height: 2.8vw; will-change: transform; animation: leafFly linear infinite; }
  @media (min-width: 700px) { .leaf { width: 12px; height: 12px; } }
  .leaf svg { display: block; width: 100%; height: 100%; }
  @keyframes leafFly {
    0%   { transform: translate(-6vw, 6vh) rotate(0deg); }
    25%  { transform: translate(22vw, 16vh) rotate(140deg); }
    50%  { transform: translate(48vw, 7vh) rotate(300deg); }
    75%  { transform: translate(74vw, 18vh) rotate(470deg); }
    100% { transform: translate(104vw, 9vh) rotate(640deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="assets/bg.webp" alt="">
  <div class="cloud" style="top:6%;  width:34vw; height:9vh;  animation-duration:95s;  animation-delay:-30s;"></div>
  <div class="cloud" style="top:14%; width:26vw; height:7vh;  animation-duration:120s; animation-delay:-80s;"></div>
  <div class="cloud" style="top:3%;  width:20vw; height:6vh;  animation-duration:140s; animation-delay:-55s;"></div>

  <div class="char active" id="cow">
    <div class="halo"></div><div class="shadow"></div>
    <video class="src" id="cowSrc" src="assets/cow_packed.mp4" autoplay muted loop playsinline preload="auto"></video>
    <canvas class="gl" id="cowGl"></canvas>
    <canvas class="c2d" id="cow2d" style="display:none"></canvas>
  </div>
  <div class="char" id="frog">
    <div class="halo"></div><div class="shadow"></div>
    <video class="src" id="frogSrc" src="assets/frog_packed.mp4" autoplay muted loop playsinline preload="auto"></video>
    <canvas class="gl" id="frogGl"></canvas>
    <canvas class="c2d" id="frog2d" style="display:none"></canvas>
  </div>
</div>
<div id="grass"></div>
<div id="leaves"></div>

<script>
(function () {
  'use strict';

  /* ================= 人物渲染：四层兜底 =================
     A. WebGL 合成打包 MP4（最快） B. Canvas2D 合成打包 MP4
     C. 动态 WebP 图            D. 原透明 WebM 视频（带框，保底） */
  var VS = 'attribute vec2 p; varying vec2 vUv;' +
           'void main(){ vUv = vec2(p.x*0.5+0.5, p.y*0.5+0.5); gl_Position = vec4(p, 0.0, 1.0); }';
  var FS = 'precision mediump float; varying vec2 vUv; uniform sampler2D t;' +
           'void main(){' +
           '  vec4 col = texture2D(t, vec2(vUv.x, vUv.y*0.5 + 0.5));' +
           '  float a = texture2D(t, vec2(vUv.x, vUv.y*0.5)).r;' +
           '  gl_FragColor = vec4(col.rgb, a);' +
           '}';

  var charStates = [];

  function setupChar(o) {
    var st = {
      video: o.video, glCanvas: o.glCanvas, c2dCanvas: o.c2dCanvas,
      mode: 'gl', dead: false, drewAny: false, checked: false, last: -1,
      gl: null, tex: null, d2: null
    };

    function toAnim() {
      if (st.dead) return; st.dead = true;
      var img = document.createElement('img');
      img.className = 'anim'; img.src = o.animSrc; img.alt = '';
      img.onerror = function () { toWebm(img); };
      if (st.glCanvas.parentNode) st.glCanvas.replaceWith(img);
      if (st.c2dCanvas.parentNode) st.c2dCanvas.remove();
      if (st.video.parentNode) st.video.remove();
    }
    function toWebm(img) {
      var v = document.createElement('video');
      v.className = 'plain'; v.src = o.webmSrc;
      v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
      if (img && img.parentNode) img.replaceWith(v);
      if (v.play) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    }
    st.toAnim = toAnim;

    function start2D() {
      if (st.dead) return;
      st.mode = '2d';
      st.glCanvas.style.display = 'none';
      st.c2dCanvas.style.display = 'block';
      var ctx = null;
      try { ctx = st.c2dCanvas.getContext('2d', { willReadFrequently: true }); } catch (e) { ctx = null; }
      if (!ctx) { toAnim(); return; }
      var off = document.createElement('canvas');
      var mOff = document.createElement('canvas');
      st.d2 = {
        ctx: ctx, off: off, offCtx: off.getContext('2d', { willReadFrequently: true }),
        mOff: mOff, mCtx: mOff.getContext('2d', { willReadFrequently: true }),
        last: -1, checked: false
      };
    }
    st.start2D = start2D;

    /* ---- A 层：WebGL ---- */
    var gl = null;
    try {
      gl = st.glCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false }) ||
           st.glCanvas.getContext('experimental-webgl', { alpha: true, premultipliedAlpha: false, antialias: false });
    } catch (e) { gl = null; }
    if (!gl) { start2D(); }
    else {
      st.gl = gl;
      function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
      var prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { start2D(); }
      else {
        gl.useProgram(prog);
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        var tex = gl.createTexture();
        st.tex = tex;
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.clearColor(0, 0, 0, 0);
      }
    }

    o.video.addEventListener('error', function () { if (!st.drewAny) toAnim(); });
    setTimeout(function () { if (!st.dead && !st.drewAny) start2D(); }, 10000);
    setTimeout(function () { if (!st.dead && !st.drewAny && st.mode === '2d') toAnim(); }, 16000);

    charStates.push(st);
    return st;
  }

  function drawGL(st) {
    var v = st.video, gl = st.gl;
    if (v.readyState < 2 || v.videoWidth === 0) return;
    if (v.currentTime === st.last) return;
    st.last = v.currentTime;
    if (st.glCanvas.width !== v.videoWidth) {
      st.glCanvas.width = v.videoWidth;
      st.glCanvas.height = Math.floor(v.videoHeight / 2);
    }
    gl.viewport(0, 0, st.glCanvas.width, st.glCanvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindTexture(gl.TEXTURE_2D, st.tex);
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);
    } catch (e) { st.start2D(); return; }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    st.drewAny = true;
    if (!st.checked) {
      st.checked = true;
      /* 抽查人物中央区域的透明度，全是 0 说明这浏览器画出来是空的，换下一层 */
      try {
        var w = st.glCanvas.width, h = st.glCanvas.height, maxA = 0, px = new Uint8Array(4);
        var pts = [[0.5, 0.35], [0.4, 0.5], [0.6, 0.5], [0.5, 0.6], [0.45, 0.25]];
        for (var i = 0; i < pts.length; i++) {
          gl.readPixels(Math.floor(w * pts[i][0]), Math.floor(h * pts[i][1]), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
          if (px[3] > maxA) maxA = px[3];
        }
        if (maxA === 0) st.start2D();
      } catch (e) { /* 读不到就不折腾 */ }
    }
  }

  function draw2D(st) {
    var v = st.video, d = st.d2;
    if (!d || v.readyState < 2 || v.videoWidth === 0) return;
    if (v.currentTime === d.last) return;
    d.last = v.currentTime;
    var W = v.videoWidth, H = Math.floor(v.videoHeight / 2), S = 0.7;
    var w2 = Math.floor(W * S), h2 = Math.floor(H * S);
    if (d.off.width !== w2) {
      d.off.width = w2; d.off.height = h2;
      d.mOff.width = w2; d.mOff.height = h2;
      st.c2dCanvas.width = w2; st.c2dCanvas.height = h2;
    }
    try {
      d.offCtx.drawImage(v, 0, 0, W, H, 0, 0, w2, h2);
      d.mCtx.drawImage(v, 0, H, W, H, 0, 0, w2, h2);
      var img = d.offCtx.getImageData(0, 0, w2, h2);
      var msk = d.mCtx.getImageData(0, 0, w2, h2);
      var a = img.data, m = msk.data;
      for (var i = 3, n = a.length; i < n; i += 4) a[i] = m[i - 3];
      d.ctx.putImageData(img, 0, 0);
    } catch (e) { st.toAnim(); return; }
    st.drewAny = true;
    if (!d.checked) {
      d.checked = true;
      try {
        var c = d.ctx.getImageData(Math.floor(w2 / 2), Math.floor(h2 * 0.55), 1, 1).data;
        if (c[3] === 0) { /* 中央不透明才正常；若为 0 再抽查几个点再决定 */
          var ok = false, probe = d.ctx.getImageData(0, 0, w2, h2).data;
          for (var j = 3, nn = probe.length; j < nn; j += 400) { if (probe[j] > 0) { ok = true; break; } }
          if (!ok) st.toAnim();
        }
      } catch (e) {}
    }
  }

  setupChar({
    video: document.getElementById('cowSrc'), glCanvas: document.getElementById('cowGl'), c2dCanvas: document.getElementById('cow2d'),
    animSrc: 'assets/cow_anim.webp', webmSrc: 'assets/cow.webm'
  });
  setupChar({
    video: document.getElementById('frogSrc'), glCanvas: document.getElementById('frogGl'), c2dCanvas: document.getElementById('frog2d'),
    animSrc: 'assets/frog_anim.webp', webmSrc: 'assets/frog.webm'
  });

  (function loop() {
    for (var i = 0; i < charStates.length; i++) {
      var st = charStates[i];
      if (st.dead) continue;
      if (st.mode === 'gl' && st.gl) drawGL(st);
      else if (st.mode === '2d') draw2D(st);
    }
    requestAnimationFrame(loop);
  })();

  /* ================= 音频：WebAudio 单通道混音 ================= */
  var MIX_DEFAULT = { cow: 1.0, frog: 0.10 };
  var MIX_FROG    = { cow: 0.32, frog: 1.0 };
  var actx = null, cowGain = null, frogGain = null, audioOn = false, restoreTimer = null;

  function startAudio() {
    if (audioOn) { if (actx && actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioOn = true;
    actx = new AC();
    cowGain = actx.createGain();  cowGain.gain.value = MIX_DEFAULT.cow;  cowGain.connect(actx.destination);
    frogGain = actx.createGain(); frogGain.gain.value = MIX_DEFAULT.frog; frogGain.connect(actx.destination);
    function load(url, gainNode) {
      fetch(url).then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) { return actx.decodeAudioData(buf); })
        .then(function (decoded) {
          var src = actx.createBufferSource();
          src.buffer = decoded; src.loop = true;
          src.connect(gainNode); src.start(0);
        }).catch(function () {});
    }
    load('assets/cow.mp3', cowGain);
    load('assets/frog.mp3', frogGain);
    if (actx.state === 'suspended') actx.resume();
  }
  window.addEventListener('pointerdown', startAudio);
  window.addEventListener('click', startAudio);
  window.addEventListener('touchend', startAudio);

  function ramp(mix, sec) {
    if (!actx || !cowGain || !frogGain) return;
    var t = actx.currentTime;
    cowGain.gain.cancelScheduledValues(t);
    frogGain.gain.cancelScheduledValues(t);
    cowGain.gain.setTargetAtTime(mix.cow, t, sec / 3);
    frogGain.gain.setTargetAtTime(mix.frog, t, sec / 3);
  }

  var cowEl = document.getElementById('cow');
  var frogEl = document.getElementById('frog');
  function setActive(el) {
    cowEl.classList.toggle('active', el === cowEl);
    frogEl.classList.toggle('active', el === frogEl);
  }
  function activateFrog() {
    startAudio(); setActive(frogEl); ramp(MIX_FROG, 0.6);
    if (restoreTimer) clearTimeout(restoreTimer);
    restoreTimer = setTimeout(function () { setActive(cowEl); ramp(MIX_DEFAULT, 0.9); }, 4000);
  }
  function activateCow() {
    startAudio(); setActive(cowEl);
    if (restoreTimer) clearTimeout(restoreTimer);
    ramp(MIX_DEFAULT, 0.6);
  }
  frogEl.addEventListener('pointerenter', activateFrog);
  frogEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateFrog(); });
  cowEl.addEventListener('pointerenter', activateCow);
  cowEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateCow(); });

  /* ================= 前景小草 ================= */
  var grass = document.getElementById('grass');
  var greens = ['#4d9b3a', '#5cab45', '#3f8a30', '#67b854'];
  var flowers = ['#ff8fb3', '#ffd34d', '#ffffff', '#c39bff'];
  var html = '';
  var count = Math.max(18, Math.floor(window.innerWidth / 46));
  for (var i = 0; i < count; i++) {
    var left = (i / (count - 1) * 100);
    var c = greens[i % greens.length];
    var blades = '';
    for (var b = -2; b <= 2; b++) {
      blades += '<path d="M50 100 Q ' + (50 + b * 9) + ' 55 ' + (50 + b * 14) + ' ' + (18 + Math.abs(b) * 7) + '" stroke="' + c + '" stroke-width="6" fill="none" stroke-linecap="round"/>';
    }
    var flower = '';
    if (i % 4 === 0) {
      var fc = flowers[i % flowers.length];
      flower = '<circle cx="50" cy="26" r="7" fill="' + fc + '"/><circle cx="50" cy="26" r="2.8" fill="#ffdf5e"/>';
    }
    html += '<svg class="tuft" style="left:' + left + '%; animation-delay:-' + (Math.random() * 3).toFixed(2) + 's; animation-duration:' + (2.8 + Math.random() * 1.6).toFixed(2) + 's" viewBox="0 0 100 100">' + blades + flower + '</svg>';
  }
  grass.innerHTML = html;

  /* ================= 飘叶 ================= */
  var leavesBox = document.getElementById('leaves');
  var leafColors = ['#7ec850', '#a5d66a', '#5cab45', '#c9e17a', '#8fd0e0'];
  for (var j = 0; j < 14; j++) {
    var d = document.createElement('div');
    d.className = 'leaf';
    var col = leafColors[j % leafColors.length];
    d.innerHTML = '<svg viewBox="0 0 20 20"><path d="M10 1 C 16 6, 17 12, 10 19 C 3 12, 4 6, 10 1 Z" fill="' + col + '" opacity="0.85"/></svg>';
    d.style.top = (Math.random() * 55) + 'vh';
    d.style.animationDuration = (16 + Math.random() * 14) + 's';
    d.style.animationDelay = (-Math.random() * 30) + 's';
    leavesBox.appendChild(d);
  }
})();
</script>
</body>
</html>
