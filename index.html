<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青青草原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #79b657; }
  body { font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: center center; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .cloud { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); pointer-events: none; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }
  .char { position: absolute; bottom: 2.5%; transform: translateX(-50%); }
  .char video { display: block; width: 100%; height: 100%; pointer-events: none; }
  .char .shadow { position: absolute; left: 50%; bottom: -2%; width: 78%; height: 5%; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(30,60,20,.35), rgba(30,60,20,0) 70%); border-radius: 50%; }
  .char .halo { position: absolute; inset: -4% -7%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,240,170,.38), rgba(255,240,170,0) 65%); opacity: 0; transition: opacity .6s; pointer-events: none; }
  .char.active .halo { opacity: 1; }
  #cow  { left: 36%; height: 74%; aspect-ratio: 1078 / 1282; z-index: 3; }
  #frog { left: 67%; height: 64%; aspect-ratio: 656 / 854;  z-index: 3; }
  @media (max-aspect-ratio: 3/4) {
    #cow  { left: 33%; height: 46%; }
    #frog { left: 71%; height: 38%; }
  }
  #grass { position: absolute; left: 0; right: 0; bottom: -6px; height: 90px; z-index: 5; pointer-events: none; }
  #grass svg { position: absolute; bottom: 0; height: 100%; overflow: visible; }
  .tuft { transform-origin: bottom center; animation: sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }
  #leaves { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="assets/bg.webp" alt="">
  <div class="cloud" style="top:6%;  width:34vw; height:9vh;  animation-duration:95s;  animation-delay:-30s;"></div>
  <div class="cloud" style="top:14%; width:26vw; height:7vh;  animation-duration:120s; animation-delay:-80s;"></div>
  <div class="cloud" style="top:3%;  width:20vw; height:6vh;  animation-duration:140s; animation-delay:-55s;"></div>
  <div class="char active" id="cow">
    <div class="halo"></div><div class="shadow"></div>
    <video src="assets/cow.webm" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <div class="char" id="frog">
    <div class="halo"></div><div class="shadow"></div>
    <video src="assets/frog.webm" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <div id="grass"></div>
</div>
<canvas id="leaves"></canvas>
<audio id="cowAudio"  src="assets/cow.mp3"  loop preload="auto"></audio>
<audio id="frogAudio" src="assets/frog.mp3" loop preload="auto"></audio>
<script>
(function () {
  'use strict';
  var cowA = document.getElementById('cowAudio');
  var frogA = document.getElementById('frogAudio');
  var MIX_DEFAULT = { cow: 1.0, frog: 0.10 };
  var MIX_FROG    = { cow: 0.32, frog: 1.0 };
  var audioStarted = false;
  var fadeTimer = null, restoreTimer = null;
  function fadeTo(mix, ms) {
    if (fadeTimer) clearInterval(fadeTimer);
    var steps = Math.max(1, Math.round(ms / 50)), i = 0;
    var c0 = cowA.volume, f0 = frogA.volume;
    fadeTimer = setInterval(function () {
      i++;
      var t = i / steps;
      cowA.volume  = Math.min(1, Math.max(0, c0 + (mix.cow  - c0) * t));
      frogA.volume = Math.min(1, Math.max(0, f0 + (mix.frog - f0) * t));
      if (i >= steps) clearInterval(fadeTimer);
    }, 50);
  }
  function playBoth() {
    if (audioStarted) return;
    audioStarted = true;
    cowA.volume = MIX_DEFAULT.cow; frogA.volume = MIX_DEFAULT.frog;
    cowA.play().catch(function () {});
    frogA.play().catch(function () {});
  }
  cowA.volume = MIX_DEFAULT.cow; frogA.volume = MIX_DEFAULT.frog;
  cowA.play().then(function () { audioStarted = true; frogA.play().catch(function () {}); }).catch(function () {});
  window.addEventListener('pointerdown', playBoth);
  var cowEl = document.getElementById('cow');
  var frogEl = document.getElementById('frog');
  function setActive(el) {
    cowEl.classList.toggle('active', el === cowEl);
    frogEl.classList.toggle('active', el === frogEl);
  }
  function activateFrog() {
    playBoth(); setActive(frogEl); fadeTo(MIX_FROG, 600);
    if (restoreTimer) clearTimeout(restoreTimer);
    restoreTimer = setTimeout(function () { setActive(cowEl); fadeTo(MIX_DEFAULT, 900); }, 4000);
  }
  function activateCow() {
    playBoth(); setActive(cowEl);
    if (restoreTimer) clearTimeout(restoreTimer);
    fadeTo(MIX_DEFAULT, 600);
  }
  frogEl.addEventListener('pointerenter', activateFrog);
  frogEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateFrog(); });
  cowEl.addEventListener('pointerenter', activateCow);
  cowEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateCow(); });

  var stage = document.getElementById('stage');
  var scale = 1, tx = 0, ty = 0;
  function apply() { stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function clampPan() {
    var mx = window.innerWidth  * (scale - 1) / 2 + 60;
    var my = window.innerHeight * (scale - 1) / 2 + 60;
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  }
  var dragging = false, lastX = 0, lastY = 0;
  var pointers = new Map(), pinchDist = 0;
  stage.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
    if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      pinchDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }
  });
  stage.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      var p = Array.from(pointers.values());
      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (pinchDist > 0) { scale = Math.max(1, Math.min(4, scale * d / pinchDist)); clampPan(); apply(); }
      pinchDist = d;
    } else if (dragging) {
      tx += e.clientX - lastX; ty += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      clampPan(); apply();
    }
  });
  function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size === 0) dragging = false; }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    scale = Math.max(1, Math.min(4, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
    clampPan(); apply();
  }, { passive: false });
  stage.addEventListener('dblclick', function () { scale = 1; tx = 0; ty = 0; apply(); });

  var grass = document.getElementById('grass');
  var greens = ['#4d9b3a', '#5cab45', '#3f8a30', '#67b854'];
  var flowers = ['#ff8fb3', '#ffd34d', '#ffffff', '#c39bff'];
  var html = '';
  for (var i = 0; i < 26; i++) {
    var left = (i / 25 * 100) + (Math.random() * 2 - 1);
    var h = 45 + Math.random() * 45;
    var c = greens[i % greens.length];
    var blades = '';
    for (var b = -2; b <= 2; b++) {
      blades += '<path d="M50 100 Q ' + (50 + b * 9) + ' 55 ' + (50 + b * 14) + ' ' + (18 + Math.abs(b) * 7) + '" stroke="' + c + '" stroke-width="5" fill="none" stroke-linecap="round"/>';
    }
    var flower = '';
    if (i % 3 === 0) {
      var fc = flowers[i % flowers.length];
      flower = '<circle cx="50" cy="26" r="6" fill="' + fc + '"/><circle cx="50" cy="26" r="2.4" fill="#ffdf5e"/>';
    }
    html += '<svg class="tuft" style="left:' + left + '%; height:' + h + 'px; animation-delay:-' + (Math.random() * 3).toFixed(2) + 's; animation-duration:' + (2.8 + Math.random() * 1.6).toFixed(2) + 's" viewBox="0 0 100 100">' + blades + flower + '</svg>';
  }
  grass.innerHTML = html;

  var canvas = document.getElementById('leaves'), ctx = canvas.getContext('2d');
  var W, H, leaves = [];
  var leafColors = ['#7ec850', '#a5d66a', '#5cab45', '#c9e17a', '#8fd0e0'];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function makeLeaf(anywhere) {
    return {
      x: anywhere ? Math.random() * W : -30,
      y: Math.random() * H * 0.9,
      s: 6 + Math.random() * 9,
      vx: 0.5 + Math.random() * 1.1,
      ph: Math.random() * Math.PI * 2,
      ps: 0.008 + Math.random() * 0.02,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.03,
      color: leafColors[Math.floor(Math.random() * leafColors.length)]
    };
  }
  for (var j = 0; j < 26; j++) leaves.push(makeLeaf(true));
  function drawLeaf(l) {
    ctx.save();
    ctx.translate(l.x, l.y + Math.sin(l.ph) * 14);
    ctx.rotate(l.rot + Math.sin(l.ph) * 0.5);
    ctx.fillStyle = l.color;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(0, -l.s);
    ctx.quadraticCurveTo(l.s * 0.9, -l.s * 0.2, 0, l.s);
    ctx.quadraticCurveTo(-l.s * 0.9, -l.s * 0.2, 0, -l.s);
    ctx.fill();
    ctx.restore();
  }
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var k = 0; k < leaves.length; k++) {
      var l = leaves[k];
      l.x += l.vx; l.ph += l.ps; l.rot += l.vr;
      if (l.x > W + 30) leaves[k] = makeLeaf(false);
      drawLeaf(l);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
