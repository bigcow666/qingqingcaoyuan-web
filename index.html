<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青青草原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none;
    background: url('assets/bg.webp') center center / cover no-repeat #6aa84f;
  }

  /* ===== 场景：横屏大图铺满全屏，比例锁定，不缩放不平移 ===== */
  #stage { position: fixed; inset: 0; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .cloud {
    position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
    pointer-events: none; animation: drift linear infinite;
  }
  @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }

  .char { position: absolute; bottom: 2.5%; transform: translateX(-50%); }
  .char video, .char img.anim { display: block; width: 100%; height: 100%; pointer-events: none; }
  .char .shadow {
    position: absolute; left: 50%; bottom: -2%; width: 78%; height: 5%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(30,60,20,.35), rgba(30,60,20,0) 70%);
    border-radius: 50%;
  }
  .char .halo {
    position: absolute; inset: -4% -7%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,240,170,.38), rgba(255,240,170,0) 65%);
    opacity: 0; transition: opacity .6s; pointer-events: none;
  }
  .char.active .halo { opacity: 1; }
  #cow  { left: 36%; height: 74%; aspect-ratio: 1078 / 1282; z-index: 3; }
  #frog { left: 67%; height: 64%; aspect-ratio: 656 / 854;  z-index: 3; }
  @media (max-aspect-ratio: 1/1) {
    #cow  { left: 28%; width: 47%; height: auto; }
    #frog { left: 73%; width: 41%; height: auto; }
  }

  /* ===== 前景小草：固定 30px，永远不变 ===== */
  #grass { position: fixed; left: 0; right: 0; bottom: 0; height: 30px; z-index: 5; pointer-events: none; }
  #grass svg { position: absolute; bottom: -4px; height: 30px; overflow: visible; }
  .tuft { transform-origin: bottom center; animation: sway 3.4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-2.6deg); } to { transform: rotate(2.6deg); } }

  #leaves { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="assets/bg.webp" alt="">
  <div class="cloud" style="top:6%;  width:34vw; height:9vh;  animation-duration:95s;  animation-delay:-30s;"></div>
  <div class="cloud" style="top:14%; width:26vw; height:7vh;  animation-duration:120s; animation-delay:-80s;"></div>
  <div class="cloud" style="top:3%;  width:20vw; height:6vh;  animation-duration:140s; animation-delay:-55s;"></div>

  <div class="char active" id="cow">
    <div class="halo"></div><div class="shadow"></div>
    <video id="cowVideo" src="assets/cow.webm" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <div class="char" id="frog">
    <div class="halo"></div><div class="shadow"></div>
    <video id="frogVideo" src="assets/frog.webm" autoplay muted loop playsinline preload="auto"></video>
  </div>
</div>
<div id="grass"></div>
<canvas id="leaves"></canvas>

<script>
(function () {
  'use strict';

  /* ---------- 透明视频兼容检测：不支持 alpha 的浏览器自动换成动图 ---------- */
  function swapToAnim() {
    var cv = document.getElementById('cowVideo'), fv = document.getElementById('frogVideo');
    if (cv) { var i1 = document.createElement('img'); i1.className = 'anim'; i1.src = 'assets/cow_anim.webp'; i1.alt = ''; cv.replaceWith(i1); }
    if (fv) { var i2 = document.createElement('img'); i2.className = 'anim'; i2.src = 'assets/frog_anim.webp'; i2.alt = ''; fv.replaceWith(i2); }
  }
  (function detectAlpha() {
    var v = document.getElementById('cowVideo');
    if (!v) return;
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; swapToAnim(); } }, 4000);
    var iv = setInterval(function () {
      if (done) { clearInterval(iv); return; }
      if (v.readyState >= 2 && v.videoWidth > 0) {
        try {
          var c = document.createElement('canvas');
          c.width = v.videoWidth; c.height = v.videoHeight;
          var g = c.getContext('2d', { willReadFrequently: true });
          g.drawImage(v, 0, 0);
          var px = g.getImageData(2, 2, 1, 1).data;
          done = true; clearTimeout(timer); clearInterval(iv);
          if (px[3] > 250) swapToAnim(); // 角落本应全透明，若不透明说明该浏览器不认透明视频
        } catch (e) { /* 读不到像素就不折腾，保持视频 */ done = true; clearTimeout(timer); clearInterval(iv); }
      }
    }, 300);
  })();

  /* ---------- 音频：WebAudio 单通道混音（两个声音一起放，不受单音频限制） ---------- */
  var MIX_DEFAULT = { cow: 1.0, frog: 0.10 };
  var MIX_FROG    = { cow: 0.32, frog: 1.0 };
  var actx = null, cowGain = null, frogGain = null, audioOn = false, restoreTimer = null;

  function startAudio() {
    if (audioOn) { if (actx && actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioOn = true;
    actx = new AC();
    cowGain = actx.createGain();  cowGain.gain.value = MIX_DEFAULT.cow;  cowGain.connect(actx.destination);
    frogGain = actx.createGain(); frogGain.gain.value = MIX_DEFAULT.frog; frogGain.connect(actx.destination);
    function load(url, gainNode) {
      fetch(url).then(function (r) { return r.arrayBuffer(); })
        .then(function (buf) { return actx.decodeAudioData(buf); })
        .then(function (decoded) {
          var src = actx.createBufferSource();
          src.buffer = decoded; src.loop = true;
          src.connect(gainNode); src.start(0);
        }).catch(function () {});
    }
    load('assets/cow.mp3', cowGain);
    load('assets/frog.mp3', frogGain);
    if (actx.state === 'suspended') actx.resume();
  }
  window.addEventListener('pointerdown', startAudio);
  window.addEventListener('click', startAudio);
  window.addEventListener('touchend', startAudio);

  function ramp(mix, sec) {
    if (!actx || !cowGain || !frogGain) return;
    var t = actx.currentTime;
    cowGain.gain.cancelScheduledValues(t);
    frogGain.gain.cancelScheduledValues(t);
    cowGain.gain.setTargetAtTime(mix.cow, t, sec / 3);
    frogGain.gain.setTargetAtTime(mix.frog, t, sec / 3);
  }

  var cowEl = document.getElementById('cow');
  var frogEl = document.getElementById('frog');
  function setActive(el) {
    cowEl.classList.toggle('active', el === cowEl);
    frogEl.classList.toggle('active', el === frogEl);
  }
  function activateFrog() {
    startAudio(); setActive(frogEl); ramp(MIX_FROG, 0.6);
    if (restoreTimer) clearTimeout(restoreTimer);
    restoreTimer = setTimeout(function () { setActive(cowEl); ramp(MIX_DEFAULT, 0.9); }, 4000);
  }
  function activateCow() {
    startAudio(); setActive(cowEl);
    if (restoreTimer) clearTimeout(restoreTimer);
    ramp(MIX_DEFAULT, 0.6);
  }
  frogEl.addEventListener('pointerenter', activateFrog);
  frogEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateFrog(); });
  cowEl.addEventListener('pointerenter', activateCow);
  cowEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); activateCow(); });

  /* ---------- 前景小草（固定大小） ---------- */
  var grass = document.getElementById('grass');
  var greens = ['#4d9b3a', '#5cab45', '#3f8a30', '#67b854'];
  var flowers = ['#ff8fb3', '#ffd34d', '#ffffff', '#c39bff'];
  var html = '';
  var count = Math.max(18, Math.floor(window.innerWidth / 46));
  for (var i = 0; i < count; i++) {
    var left = (i / (count - 1) * 100);
    var c = greens[i % greens.length];
    var blades = '';
    for (var b = -2; b <= 2; b++) {
      blades += '<path d="M50 100 Q ' + (50 + b * 9) + ' 55 ' + (50 + b * 14) + ' ' + (18 + Math.abs(b) * 7) + '" stroke="' + c + '" stroke-width="6" fill="none" stroke-linecap="round"/>';
    }
    var flower = '';
    if (i % 4 === 0) {
      var fc = flowers[i % flowers.length];
      flower = '<circle cx="50" cy="26" r="7" fill="' + fc + '"/><circle cx="50" cy="26" r="2.8" fill="#ffdf5e"/>';
    }
    html += '<svg class="tuft" style="left:' + left + '%; animation-delay:-' + (Math.random() * 3).toFixed(2) + 's; animation-duration:' + (2.8 + Math.random() * 1.6).toFixed(2) + 's" viewBox="0 0 100 100">' + blades + flower + '</svg>';
  }
  grass.innerHTML = html;

  /* ---------- 飘叶（固定大小） ---------- */
  var canvas = document.getElementById('leaves'), ctx = canvas.getContext('2d');
  var W, H, leaves = [];
  var leafColors = ['#7ec850', '#a5d66a', '#5cab45', '#c9e17a', '#8fd0e0'];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function makeLeaf(anywhere) {
    return {
      x: anywhere ? Math.random() * W : -30,
      y: Math.random() * H * 0.9,
      s: 6 + Math.random() * 7,
      vx: 0.5 + Math.random() * 1.1,
      ph: Math.random() * Math.PI * 2,
      ps: 0.008 + Math.random() * 0.02,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.03,
      color: leafColors[Math.floor(Math.random() * leafColors.length)]
    };
  }
  for (var j = 0; j < 22; j++) leaves.push(makeLeaf(true));
  function drawLeaf(l) {
    ctx.save();
    ctx.translate(l.x, l.y + Math.sin(l.ph) * 14);
    ctx.rotate(l.rot + Math.sin(l.ph) * 0.5);
    ctx.fillStyle = l.color;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(0, -l.s);
    ctx.quadraticCurveTo(l.s * 0.9, -l.s * 0.2, 0, l.s);
    ctx.quadraticCurveTo(-l.s * 0.9, -l.s * 0.2, 0, -l.s);
    ctx.fill();
    ctx.restore();
  }
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var k = 0; k < leaves.length; k++) {
      var l = leaves[k];
      l.x += l.vx; l.ph += l.ps; l.rot += l.vr;
      if (l.x > W + 30) leaves[k] = makeLeaf(false);
      drawLeaf(l);
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
